<!DOCTYPE html>
<html lang="es">

<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />

    <!-- Viewport: le avisa al celular que use el ancho real de su pantalla
         y no una pantalla de escritorio simulada -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bienvenida</title>
</head>

<!-- Documento minimo. Es el que se carga por defecto dentro del iframe
     (atributo src del <iframe>), y sirve para que se note el cambio
     cuando se hace click en los enlaces del menu. -->
<body style="background-color:lightyellow">

    <h2>Contenido inicial del marco</h2>

    <p>
        Esta página es un documento HTML independiente
        (<strong>bienvenida.html</strong>) que está cargado
        <em>adentro</em> del iframe.
    </p>

    <p>
        Usá los enlaces del menú que está arriba del marco: cada uno reemplaza este
        contenido por otro documento, <strong>sin recargar la página que contiene el marco</strong>.
    </p>

</body>
</html>
